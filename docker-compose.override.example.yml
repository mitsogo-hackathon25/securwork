# Local Docker overrides — copy to docker-compose.override.yml (gitignored).
# docker compose automatically merges override files with docker-compose.yml.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Use this for local-only settings (Vite port 5180, hot reload, SQLite, etc.)
# without changing production docker-compose.yml.

services:
  backend:
    environment:
      USE_SQLITE: "true"
      DEBUG: "true"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5180,http://localhost:5180"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5180,http://localhost:5180"
      FRONTEND_URL: "http://127.0.0.1:5180"

  frontend:
    ports:
      - "5180:5180"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5180"
