# SecurWork — Host nginx when the app runs in Docker Compose (/opt/securwork/securwork).
# Frontend container: 127.0.0.1:8080 → proxies /api/, /media/, /django-admin/ to backend.
#
# Install:
#   sudo cp /opt/securwork/securwork/deploy/nginx/securwork-docker-proxy.conf \
#       /etc/nginx/sites-available/securwork
#   sudo ln -sf /etc/nginx/sites-available/securwork /etc/nginx/sites-enabled/securwork
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# CRITICAL: client_max_body_size 256M on the host — default 1M causes HTTP 413 on
# hero image upload, CSV import, and other multipart /api/ POSTs before Docker sees the body.

upstream securwork_frontend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name securwork.it www.securwork.it;
    return 301 https://www.securwork.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name securwork.it;

    ssl_certificate     /etc/letsencrypt/live/securwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securwork.it/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.securwork.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.securwork.it;

    ssl_certificate     /etc/letsencrypt/live/securwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securwork.it/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 256M;

    location / {
        client_max_body_size 256M;
        proxy_pass http://securwork_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
