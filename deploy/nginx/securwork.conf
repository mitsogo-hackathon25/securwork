# SecurWork — Nginx (Django API + React SPA)
# Copy to /etc/nginx/sites-available/securwork

upstream django_backend {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name securwork.it www.securwork.it;
    return 301 https://www.securwork.it$request_uri;
}

# HTTPS non-www → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name securwork.it;

    ssl_certificate     /etc/letsencrypt/live/securwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securwork.it/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.securwork.it$request_uri;
}

# Main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.securwork.it;

    ssl_certificate     /etc/letsencrypt/live/securwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securwork.it/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64M;

    # React SPA (built static files)
    root /var/www/securwork/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sitemap (generated by Django)
    location = /sitemap.xml {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django API
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media uploads
    location /media/ {
        alias /var/www/securwork/backend/media/;
        expires 30d;
    }

    # Django static (admin assets)
    location /static/ {
        alias /var/www/securwork/backend/staticfiles/;
        expires 30d;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
